name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # false on purpose. With true, a push cancels the in-flight deploy, and on a day
  # when the Pages backend publishes slowly (2026-08-06: ~15 min instead of ~10 s),
  # pushing more often than that means NOTHING ever completes: each deploy dies
  # mid-publish and leaves a zombie deployment_in_progress record on the backend
  # that even the cancel API would not clear. Queued runs waiting their turn cost
  # only latency; cancelled half-published deploys cost the deploy itself.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The site lives in web/ and builds from the published data in data/. The privacy checks
      # need no install: only aggregated, allowed fields may be published.
      - run: node --test tests/*.test.mjs
      - run: npm ci
        working-directory: web
      # The tests gate the artifact: every text the page asks for exists, house style unedited.
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Do NOT add `timeout:` here hoping to survive a slow Pages day. It cannot
      # work: deploy-pages clamps the input with Math.min(timeoutInput, MAX_TIMEOUT)
      # where MAX_TIMEOUT = 600000 (src/internal/deployment.js, unchanged across
      # v4, v5 and main), and the Pages backend enforces its own 10-minute deadline
      # anyway: GitHub's docs say so outright. The input can only ever *lower* the
      # wait. Tried on 2026-08-06: `timeout: 1800000` was accepted and echoed in the
      # log, and the job still aborted at 604 seconds.
      #
      # When Pages is slow, deploy-pages gives up at ten minutes and then CANCELS
      # the deployment, so the run goes red. Two things worth knowing before
      # reacting to that:
      #   - The site usually still publishes. On 2026-08-06 the content went live
      #     about three minutes AFTER the action had reported failure and cancelled,
      #     and later cancellations did not roll it back. Check the deployed asset
      #     hashes before believing the red X.
      #   - A Pages deployment id IS the commit SHA (actions/deploy-pages#383), so
      #     re-running a cancelled run recreates the same cancelled deployment and
      #     fails in seconds with a misleading "Deployment cancelled". Push a new
      #     commit instead of re-running.
      - id: deployment
        uses: actions/deploy-pages@v4
